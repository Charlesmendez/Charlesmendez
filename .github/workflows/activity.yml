name: Update README Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch public activity
        env:
          GH_USERNAME: Charlesmendez
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/$GH_USERNAME/events/public?per_page=10" \
            > events.json

      - name: Update README
        env:
          GH_USERNAME: Charlesmendez
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          username = os.environ["GH_USERNAME"]
          readme_path = Path("README.md")
          events_path = Path("events.json")

          start_marker = "<!--START_SECTION:activity-->"
          end_marker = "<!--END_SECTION:activity-->"

          if not readme_path.exists():
              raise SystemExit("README.md not found")

          if not events_path.exists():
              raise SystemExit("events.json not found")

          events = json.loads(events_path.read_text(encoding="utf-8"))

          def line_for_event(event):
              etype = event.get("type", "")
              repo = event.get("repo", {}).get("name", "")
              payload = event.get("payload", {}) or {}

              if etype == "PushEvent":
                  commits = payload.get("commits", [])
                  count = len(commits)
                  if count == 1:
                      return f"- Pushed 1 commit to `{repo}`"
                  return f"- Pushed {count} commits to `{repo}`"

              if etype == "PullRequestEvent":
                  action = payload.get("action", "updated")
                  pr = payload.get("pull_request", {}) or {}
                  title = pr.get("title", "pull request")
                  url = pr.get("html_url", "")
                  if url:
                      return f"- {action.capitalize()} PR [{title}]({url}) in `{repo}`"
                  return f"- {action.capitalize()} PR `{title}` in `{repo}`"

              if etype == "IssuesEvent":
                  action = payload.get("action", "updated")
                  issue = payload.get("issue", {}) or {}
                  title = issue.get("title", "issue")
                  url = issue.get("html_url", "")
                  if url:
                      return f"- {action.capitalize()} issue [{title}]({url}) in `{repo}`"
                  return f"- {action.capitalize()} issue `{title}` in `{repo}`"

              if etype == "IssueCommentEvent":
                  issue = payload.get("issue", {}) or {}
                  title = issue.get("title", "issue")
                  url = issue.get("html_url", "")
                  if url:
                      return f"- Commented on [{title}]({url}) in `{repo}`"
                  return f"- Commented on `{title}` in `{repo}`"

              if etype == "CreateEvent":
                  ref_type = payload.get("ref_type", "item")
                  ref = payload.get("ref") or repo
                  return f"- Created {ref_type} `{ref}` in `{repo}`"

              if etype == "ReleaseEvent":
                  release = payload.get("release", {}) or {}
                  name = release.get("name") or release.get("tag_name") or "release"
                  return f"- Published release `{name}` in `{repo}`"

              if etype == "WatchEvent":
                  return f"- Starred `{repo}`"

              if etype == "ForkEvent":
                  return f"- Forked `{repo}`"

              return None

          lines = []
          seen = set()

          for event in events:
              line = line_for_event(event)
              if line and line not in seen:
                  seen.add(line)
                  lines.append(line)
              if len(lines) >= 5:
                  break

          if not lines:
              lines = ["- No recent public GitHub activity found"]

          replacement = start_marker + "\n" + "\n".join(lines) + "\n" + end_marker

          content = readme_path.read_text(encoding="utf-8")

          pattern = re.compile(
              re.escape(start_marker) + r".*?" + re.escape(end_marker),
              re.DOTALL
          )

          if not pattern.search(content):
              raise SystemExit(
                  "README.md is missing the activity markers:\n"
                  "<!--START_SECTION:activity-->\n"
                  "<!--END_SECTION:activity-->"
              )

          updated = pattern.sub(replacement, content)
          readme_path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README activity"
          git push
